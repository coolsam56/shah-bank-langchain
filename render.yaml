services:
  - type: web
    name: smart-banking-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BANK_NAME
        value: DemoBank
      - key: PERSONAL_LOAN_ANNUAL_RATE
        value: "10.5"

  - type: web
    name: smart-banking-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MODEL_NAME
        value: openai/gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: API_BASE_URL
        fromService:
          type: web
          name: smart-banking-api
          property: hostport
